<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250">
<style>
  text { font-family: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .twinkle { animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .bar { transform-box: fill-box; transform-origin: 0 50%; animation: grow 1.6s ease-out; }
  @keyframes grow { from { transform: scaleX(0); } }
</style>
<defs>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5eead4"/>
    <stop offset="1" stop-color="#3fb950"/>
  </linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0f1730"/>
    <stop offset="1" stop-color="#0b1122"/>
  </linearGradient>
</defs>
<rect x="1.5" y="1.5" width="417" height="247" rx="14" fill="url(#bg)" stroke="url(#border)" stroke-opacity=".7" stroke-width="1.5"/>
<text x="24" y="38" font-size="17" font-weight="700" fill="#e6edf3">Stack de linguagens</text>
<text x="24" y="58" font-size="11" fill="#5eead4">ponderado pelos repositórios</text>
<text x="396" y="38" font-size="11" fill="#5eead4" text-anchor="end">&gt; stack.scan<tspan class="cursor">_</tspan></text>
<circle cx="30" cy="86" r="5" fill="#f1e05a"/>
<text x="44" y="90" font-size="13" fill="#e6edf3">JavaScript</text>
<text x="196" y="90" font-size="12" fill="#f1e05a" text-anchor="end">40%</text>
<rect x="210" y="81" width="186" height="8" rx="4" fill="#1c2747"/>
<rect class="bar" x="210" y="81" width="74.7" height="8" rx="4" fill="#f1e05a"/>
<circle cx="30" cy="118" r="5" fill="#3178c6"/>
<text x="44" y="122" font-size="13" fill="#e6edf3">TypeScript</text>
<text x="196" y="122" font-size="12" fill="#3178c6" text-anchor="end">30%</text>
<rect x="210" y="113" width="186" height="8" rx="4" fill="#1c2747"/>
<rect class="bar" x="210" y="113" width="56.4" height="8" rx="4" fill="#3178c6"/>
<circle cx="30" cy="150" r="5" fill="#3572A5"/>
<text x="44" y="154" font-size="13" fill="#e6edf3">Python</text>
<text x="196" y="154" font-size="12" fill="#3572A5" text-anchor="end">18%</text>
<rect x="210" y="145" width="186" height="8" rx="4" fill="#1c2747"/>
<rect class="bar" x="210" y="145" width="33.8" height="8" rx="4" fill="#3572A5"/>
<circle cx="30" cy="182" r="5" fill="#663399"/>
<text x="44" y="186" font-size="13" fill="#e6edf3">CSS</text>
<text x="196" y="186" font-size="12" fill="#663399" text-anchor="end">6%</text>
<rect x="210" y="177" width="186" height="8" rx="4" fill="#1c2747"/>
<rect class="bar" x="210" y="177" width="11.5" height="8" rx="4" fill="#663399"/>
<circle cx="30" cy="214" r="5" fill="#e34c26"/>
<text x="44" y="218" font-size="13" fill="#e6edf3">HTML</text>
