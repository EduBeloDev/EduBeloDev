<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250">
<style>
  text { font-family: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .twinkle { animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
<defs>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5eead4"/>
    <stop offset="1" stop-color="#3fb950"/>
  </linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0f1730"/>
    <stop offset="1" stop-color="#0b1122"/>
  </linearGradient>
</defs>
<rect x="1.5" y="1.5" width="417" height="247" rx="14" fill="url(#bg)" stroke="url(#border)" stroke-opacity=".7" stroke-width="1.5"/>
<text x="24" y="38" font-size="13" fill="#e6edf3">Projects.list <tspan fill="#8b9bb4">./projetos.sh --all</tspan><tspan class="cursor" fill="#5eead4">_</tspan></text>
<text x="24" y="120" font-size="13" fill="#8b9bb4">Os primeiros projetos estão a caminho.</text>
</svg>
