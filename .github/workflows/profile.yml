name: Gerar imagens do perfil

on:
  # atualiza automaticamente a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"

  # permite rodar manualmente pela aba Actions
  workflow_dispatch:

  # roda a cada push na main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # cabeçalho com o Doodieman, stack de linguagens e projetos em destaque
      - name: Gerar cards do perfil
        run: python3 scripts/profile_cards.py --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # "cidade" 3D das contribuições (yoshi389111/github-profile-3d-contrib)
      - name: Gerar gráfico 3D das contribuições
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Copiar gráfico 3D para dist
        run: cp profile-3d-contrib/*.svg dist/

      # gera a animação a partir do gráfico de contribuições (versão clara e escura)
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # publica tudo na branch "output", usada pelo README
      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
