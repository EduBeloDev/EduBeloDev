name: Gerar imagens do perfil

on:
  # atualiza automaticamente a cada 4 horas
  schedule:
    - cron: "0 */4 * * *"

  # permite rodar manualmente pela aba Actions
  workflow_dispatch:

  # roda a cada push na main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # cabeçalho com o personagem em LEDs, cidade 3D das contribuições
      # (inspirada no yoshi389111/github-profile-3d-contrib), linguagens e projetos
      - name: Gerar cards do perfil
        run: python3 scripts/profile_cards.py --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # publica tudo na branch "output", usada pelo README
      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
